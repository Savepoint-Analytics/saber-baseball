[project]
name = "saber-baseball"
version = "0.1.0"
description = "Savepoint Analytics — reproducible, compliant MLB sabermetrics platform (game-outcome prediction, player/team analysis, season simulation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Oswald", email = "alex@savepointanalytics.com" }]

# Runtime deps for Phase 1 (ingestion). Modeling/sim deps live in the
# [project.optional-dependencies] groups below so a bare ingest install stays light.
dependencies = [
    "pybaseball>=2.2.7",       # MIT — primary data acquisition (Statcast/Retrosheet/Lahman/Chadwick)
    "MLB-StatsAPI>=1.6.1",     # GPLv3 — runtime dep only; official MLB Stats API wrapper
    "polars>=1.0",             # MIT — large/pitch-level frames
    "pandas>=2.2",             # BSD — ecosystem compatibility (pybaseball returns pandas)
    "pyarrow>=16.0",           # Apache-2.0 — Parquet interchange
    "duckdb>=1.0",             # MIT — OLAP engine over Parquet
    "pandera>=0.20",           # MIT — schema validation gates
    "boto3>=1.34",             # Apache-2.0 — S3/MinIO client
    "s3fs>=2024.6.0",          # BSD — fsspec S3/MinIO filesystem for Parquet IO
    "requests>=2.32",          # Apache-2.0 — HTTP
    "tenacity>=8.4",           # Apache-2.0 — retry/backoff
    "platformdirs>=4.2",       # MIT — cache dir resolution
    "pydantic>=2.7",           # MIT — typed settings
    "pydantic-settings>=2.3",  # MIT — env-driven config
    "python-dotenv>=1.0",      # BSD — .env loading
    "typer>=0.12",             # MIT — CLI entrypoints
    "loguru>=0.7",             # MIT — logging
]

[project.optional-dependencies]
warehouse = [
    "sqlalchemy>=2.0",         # MIT
    "psycopg[binary]>=3.2",    # LGPL — Postgres driver
    "dbt-core>=1.8",           # Apache-2.0
    "dbt-postgres>=1.8",       # Apache-2.0
    "dbt-duckdb>=1.8",         # Apache-2.0
]
orchestration = [
    "dagster>=1.7",            # Apache-2.0
    "dagster-webserver>=1.7",  # Apache-2.0
]
modeling = [
    "scikit-learn>=1.5",       # BSD
    "xgboost>=2.1",            # Apache-2.0
    "lightgbm>=4.4",           # MIT
    "statsmodels>=0.14",       # BSD
    "pymc>=5.16",              # Apache-2.0
    "bambi>=0.13",             # MIT
    "mlflow>=2.14",            # Apache-2.0
]
serving = [
    "streamlit>=1.36",         # Apache-2.0
    "altair>=5.3",             # BSD
]
dev = [
    "ruff>=0.5",               # MIT
    "mypy>=1.10",              # MIT
    "pytest>=8.2",             # MIT
    "pytest-cov>=5.0",         # MIT
    "types-requests",
]

[project.scripts]
saber-ingest = "src.ingestion.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PD"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # typer.Option/.Argument in defaults is the idiomatic Typer pattern
    "UP042",  # `class X(str, Enum)` is intentional for JSON-serializable sources
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
