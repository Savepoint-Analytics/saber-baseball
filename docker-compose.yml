# Savepoint-Lab local stack: PostgreSQL (curated warehouse) + MinIO (raw object
# store) + Dagster (orchestration). Self-hosted, ~$0 recurring. Secrets come from
# .env (git-ignored) — never commit real credentials. See CLAUDE.md §4.
name: saber-baseball

services:
  postgres:
    image: postgres:16
    container_name: saber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-saber_baseball}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saber}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO is AGPLv3 — we self-host the UNMODIFIED image, which is compliant
  # (network-service obligations trigger only on distributing a modified version).
  minio:
    image: minio/minio:latest
    container_name: saber-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: create the bronze bucket on first boot.
  minio-init:
    image: minio/mc:latest
    container_name: saber-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-saber} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:-saber-bronze};
      mc anonymous set none local/${MINIO_BUCKET:-saber-bronze};
      echo 'bronze bucket ready';
      "

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: saber-dagster
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    volumes:
      - ./:/app
    working_dir: /app
    command: dagster dev -h 0.0.0.0 -p 3000 -m orchestration.definitions

volumes:
  pgdata:
  miniodata:
