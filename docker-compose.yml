# Savepoint-Lab local stack: PostgreSQL (curated warehouse) + MinIO (raw object
# store) + Prefect (orchestration). Self-hosted, ~$0 recurring. Secrets come from
# .env (git-ignored) — never commit real credentials. See CLAUDE.md §4.
name: saber-baseball

services:
  postgres:
    image: postgres:16
    container_name: saber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-saber_baseball}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saber}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO is AGPLv3 — we self-host the UNMODIFIED image, which is compliant
  # (network-service obligations trigger only on distributing a modified version).
  minio:
    image: minio/minio:latest
    container_name: saber-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: create the bronze bucket on first boot.
  minio-init:
    image: minio/mc:latest
    container_name: saber-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-saber} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:-saber-bronze};
      mc anonymous set none local/${MINIO_BUCKET:-saber-bronze};
      echo 'bronze bucket ready';
      "

  # Prefect splits into two processes: the API/UI server, and a long-running
  # process that serves the scheduled deployment. `dagster dev` bundled both, which
  # is why this is two services where there used to be one.
  prefect-server:
    build:
      context: .
      dockerfile: Dockerfile.prefect
    container_name: saber-prefect-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      # Prefect's own metadata (flow runs, schedules) lives in a SQLite file here.
      # Deliberately NOT pointed at the `sports` Postgres: orchestrator bookkeeping
      # is not analytics data, and mixing them would put churn-heavy internal tables
      # in the warehouse every vertical's BI layer reads.
      - prefectdata:/root/.prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  prefect-flows:
    build:
      context: .
      dockerfile: Dockerfile.prefect
    container_name: saber-prefect-flows
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    env_file: .env
    environment:
      # Overrides whatever .env carries: inside the network the API is reachable at
      # the service name, not the localhost the host machine uses.
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./:/app
    working_dir: /app
    command: python -m orchestration.flows

volumes:
  pgdata:
  miniodata:
  prefectdata:
