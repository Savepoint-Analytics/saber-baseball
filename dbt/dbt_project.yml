name: saber_baseball
version: "0.1.0"
config-version: 2
profile: saber_baseball

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layering (CLAUDE.md §4): bronze views over Parquet (dbt-duckdb),
# silver/gold materialized in Postgres (dbt-postgres). Select target per layer.
models:
  saber_baseball:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
