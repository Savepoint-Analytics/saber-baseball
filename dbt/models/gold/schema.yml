version: 2

models:
  - name: gd_team_season_record
    description: >
      Team record and run differential per season and season phase. Grain is
      (season, season_phase, team_id) — regular season and postseason are kept as
      separate rows so baselines can be fit on regular-season play only. A team with
      no 'postseason' row missed the playoffs that year.
    tests:
      # The grain itself: pooling phases back together would silently reintroduce
      # the bug this split was made to fix, so pin it with a test.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, season_phase, team_id]
    columns:
      - name: season
        tests: [not_null]
      - name: season_phase
        description: "'regular' or 'postseason'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["regular", "postseason"]
      - name: team_id
        tests: [not_null]
      - name: games
        description: "Games played in this phase. 162 for a full regular season."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= wins + losses"
      - name: win_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: gd_team_form
    description: >
      Rolling 30-game Statcast form per team as known before each game — the
      feature row for outcome models. Grain is (game_pk, team_id). Every window
      excludes the current row, so these features are safe to train on.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, team_id]
    columns:
      - name: game_pk
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: games_in_window
        description: "Prior games contributing to the window; 0 for a team's first ever game."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 30
                inclusive: true

  - name: gd_starter_form
    description: >
      Rolling 10-start form for each starting pitcher as known before the start,
      including times-through-the-order splits. Grain is (game_pk, pitcher).
      Every window excludes the current start.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, pitcher]
    columns:
      - name: game_pk
        tests: [not_null]
      - name: pitcher
        tests: [not_null]
      - name: starts_in_window
        description: "Prior starts in the window; 0 for a pitcher's first ever start."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 10, inclusive: true}

  - name: gd_bullpen_form
    description: >
      Rolling bullpen quality (30 games) and recent workload/fatigue (3 games) per
      team, as known before each game. Grain is (game_pk, team_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, team_id]
    columns:
      - name: bp_recent_bf
        description: "Batters faced by the bullpen in the previous 3 games (fatigue)."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 200, inclusive: true}

  - name: gd_park_factor
    description: >
      Run-scoring park factor per (season, venue_id), built from the three seasons
      before the target season so it is never fitted on the runs it is applied to.
      1.0 is neutral. Venues with < 200 window games fall back to 1.0.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, venue_id]
    columns:
      - name: park_factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.6, max_value: 1.6, inclusive: true}

  - name: gd_run_expectancy
    description: >
      RE24 matrix: expected runs from each base-out state to the end of the
      half-inning, bucketed by era. Walk-off (truncated) half-innings excluded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [era, state]
    columns:
      - name: run_expectancy
        description: "Expected runs to end of inning. ~0.5 bases-empty-0-out, ~2.3 loaded-0-out."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.0, max_value: 3.0, inclusive: true}

  - name: gd_run_expectancy_season
    description: >
      RE24 matrix per season rather than per era — the baseline for player value,
      so "above average" means above this season's average. Same population rules
      as gd_run_expectancy.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, state]
    columns:
      - name: run_expectancy
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.0, max_value: 3.0, inclusive: true}
      - name: plate_appearances
        description: "PAs observed in this state; the rarest (runner on third, none out) has ~400, 143 in 2020."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 100, inclusive: true}

  - name: gd_base_transitions
    description: >
      Empirical P(next state, runs | state, outcome). state_after = 24 is the
      absorbing three-outs state. Walk-off half-innings excluded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [era, state_before, outcome, state_after, runs_on_play]
    columns:
      - name: prob
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: state_after
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 24, inclusive: true}

  - name: gd_pitcher_removal
    description: >
      Empirical P(pitcher removed after this PA | starter, times through order,
      batters faced). The substitution policy the simulator samples from.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [era, is_starter, tto, bf_bucket]
    columns:
      - name: removal_hazard
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}

  - name: gd_weather_factor
    description: >
      Run-environment multiplier from temperature, wind direction and roof state.
      Composes multiplicatively with gd_park_factor. 1.0 is neutral.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [era, temp_band, wind_out_sign, is_indoor]
    columns:
      - name: weather_factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.7, max_value: 1.4, inclusive: true}

  - name: gd_run_env_direction
    description: >
      How a richer run environment redistributes outcomes (log rate ratio, high vs
      low environment). The simulator scales this direction to hit a target run
      multiplier.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [era, outcome]
    columns:
      - name: log_ratio
        tests: [not_null]

  - name: gd_pitcher_form_direction
    description: >
      Shape of a pitcher's bad night vs his good night, split within-pitcher on
      K-BB rate. Direction only — the magnitude of day-to-day form is estimated
      separately from a variance decomposition.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [era, outcome]
    columns:
      - name: log_ratio
        tests: [not_null]

  - name: gd_reliever_leverage
    description: >
      Mean season on-base allowed by the relievers managers summon in each score
      band. Higher is worse, so it rises from close games to blowouts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [era, leverage_band]}
    columns:
      - name: mean_obr_allowed
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.2, max_value: 0.45}

  - name: gd_pitcher_fade
    description: >
      Residual on-base allowed by batters-faced band, controlling for the batter's
      and pitcher's own season rates. Deep bands are survivor-biased.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [era, bf_band]}
    columns:
      - name: residual_obr
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -0.1, max_value: 0.1}

  - name: gd_batter_pitch_profile
    description: >
      Batter on-base by pitch family, relative to his own overall rate. A weak
      signal: year-over-year r ~ +0.16 fastball, +0.15 offspeed, +0.04 breaking.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, batter, pitch_family]}
    columns:
      - name: relative_obr
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -0.6, max_value: 0.6}

  - name: gd_pitcher_pitch_mix
    description: >
      Share of a pitcher's plate appearances ending on each pitch family.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, pitcher, pitch_family]}
    columns:
      - name: share
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}


  - name: gd_pa_run_value
    description: >
      RE24 run value of every plate appearance: RE(after) - RE(before) + runs, from
      gd_run_expectancy_season for the PA's season. Grain is (game_pk, at_bat_number). The
      building block for player RE24, linear weights and the season marts; not
      published (PA-level detail stays in the lake).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, at_bat_number]
      # Every PA must find its season and state in the RE matrix. A silent miss
      # would drop rows from the inner join and every downstream total would be
      # quietly short.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('sv_plate_appearances')
    columns:
      - name: re24
        description: "Batting-team run value of the PA. A bases-empty HR is exactly 1 + RE(0 out, empty) - RE(0 out, empty) = 1."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -3.0, max_value: 6.0, inclusive: true}
      - name: re_before
        tests: [not_null]
      - name: re_after
        tests: [not_null]
      - name: wpa
        description: "Change in the batting team's win probability across the PA. A walk-off grand slam from far behind is the ceiling."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -1, max_value: 1, inclusive: true}
      - name: leverage
        tests: [not_null]

  - name: gd_win_probability
    description: >
      Home win probability and leverage index for every (season, inning, half,
      score difference, base-out state), solved analytically from the odds-ratio
      model's league/state/side rates and gd_base_transitions (a dbt Python model
      over src.features.win_probability). Inning 10 is any extra inning; state 24
      is "half-inning over"; score_diff is home minus away, clamped to +-20.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, inning, half, score_diff, state]
    columns:
      - name: win_prob
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: leverage
        description: "Expected |dWP| over the next PA, scaled so the season's average PA is 1.0. Null for state 24."
        tests:
          - not_null:
              config: {where: "state < 24"}
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 12, inclusive: true}
      - name: half
        tests:
          - accepted_values:
              arguments: {values: ["Top", "Bot"]}

  - name: gd_player_re24
    description: >
      RE24 per player-season, one row per role (batter / pitcher). Positive is
      good in both roles: a pitcher's re24 is the negative of what the batters he
      faced accrued. League totals of the two roles cancel by construction.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, season_phase, role, player_id]
    columns:
      - name: role
        tests:
          - accepted_values:
              arguments: {values: ["batter", "pitcher"]}
      - name: pa
        description: "PAs as a batter, or batters faced as a pitcher (a 200-inning starter faces ~850)."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 1100, inclusive: true}
      - name: re24
        tests: [not_null]
      - name: wpa
        tests: [not_null]
      - name: mean_leverage
        description: "Mean leverage index of the player's PAs. A one-PA pinch hitter in a walk-off spot can reach ~11."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 12, inclusive: true}

  - name: gd_linear_weights
    description: >
      Average run value of each PA outcome per season, measured from
      gd_pa_run_value over complete half-innings. Already centred: the PA-weighted
      mean across outcomes is zero.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, outcome]
    columns:
      - name: run_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -0.5, max_value: 2.0, inclusive: true}
      - name: plate_appearances
        description: "Triples are the rarest outcome: ~900 a full season, 226 in 2020."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 100, inclusive: true}

  - name: gd_batter_season
    description: >
      One row per batter-season: counting stats, K/BB/on-base rates, wOBA/xwOBA,
      RE24 (context-included), linear-weights RAA (context-neutral), PA-weighted
      park factor and the park-adjusted run values. Raw rates, not shrunk.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, season_phase, player_id]
    columns:
      - name: pa
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= k + bb + hbp + singles + doubles + triples + hr + roe + outs"
      - name: woba
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2.5, inclusive: true}
      - name: on_base_rate
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: park_factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.6, max_value: 1.6, inclusive: true}
      - name: lw_raa_park_adj
        tests: [not_null]

  - name: gd_pitcher_season
    description: >
      One row per pitcher-season: batters faced, outcomes allowed, rates, wOBA/xwOBA
      allowed, RE24 saved and linear-weights RAA saved (positive = runs prevented),
      PA-weighted park factor and the park-adjusted values. Starts per
      sv_statcast_pitcher_game.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, season_phase, player_id]
    columns:
      - name: bf
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= k + bb + hbp + singles + doubles + triples + hr + roe + outs"
      - name: starts
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= games"
      - name: on_base_allowed
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: park_factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0.6, max_value: 1.6, inclusive: true}
      - name: lw_raa_saved_park_adj
        tests: [not_null]
