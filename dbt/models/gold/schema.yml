version: 2

models:
  - name: gd_team_season_record
    description: >
      Team record and run differential per season and season phase. Grain is
      (season, season_phase, team_id) — regular season and postseason are kept as
      separate rows so baselines can be fit on regular-season play only. A team with
      no 'postseason' row missed the playoffs that year.
    tests:
      # The grain itself: pooling phases back together would silently reintroduce
      # the bug this split was made to fix, so pin it with a test.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, season_phase, team_id]
    columns:
      - name: season
        tests: [not_null]
      - name: season_phase
        description: "'regular' or 'postseason'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["regular", "postseason"]
      - name: team_id
        tests: [not_null]
      - name: games
        description: "Games played in this phase. 162 for a full regular season."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= wins + losses"
      - name: win_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
