version: 2

models:
  - name: gd_team_season_record
    description: >
      Team record and run differential per season and season phase. Grain is
      (season, season_phase, team_id) — regular season and postseason are kept as
      separate rows so baselines can be fit on regular-season play only. A team with
      no 'postseason' row missed the playoffs that year.
    tests:
      # The grain itself: pooling phases back together would silently reintroduce
      # the bug this split was made to fix, so pin it with a test.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, season_phase, team_id]
    columns:
      - name: season
        tests: [not_null]
      - name: season_phase
        description: "'regular' or 'postseason'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["regular", "postseason"]
      - name: team_id
        tests: [not_null]
      - name: games
        description: "Games played in this phase. 162 for a full regular season."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= wins + losses"
      - name: win_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: gd_team_form
    description: >
      Rolling 30-game Statcast form per team as known before each game — the
      feature row for outcome models. Grain is (game_pk, team_id). Every window
      excludes the current row, so these features are safe to train on.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, team_id]
    columns:
      - name: game_pk
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: games_in_window
        description: "Prior games contributing to the window; 0 for a team's first ever game."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 30
                inclusive: true

  - name: gd_starter_form
    description: >
      Rolling 10-start form for each starting pitcher as known before the start,
      including times-through-the-order splits. Grain is (game_pk, pitcher).
      Every window excludes the current start.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, pitcher]
    columns:
      - name: game_pk
        tests: [not_null]
      - name: pitcher
        tests: [not_null]
      - name: starts_in_window
        description: "Prior starts in the window; 0 for a pitcher's first ever start."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 10, inclusive: true}

