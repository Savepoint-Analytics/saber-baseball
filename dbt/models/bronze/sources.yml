version: 2

# Bronze sources are the raw Parquet partitions our Python ingestion lands in MinIO
# (or ./data/bronze locally). dbt-duckdb reads them via read_parquet/httpfs. Paths
# resolve through the `bronze_path` macro so local vs MinIO is one switch.
sources:
  - name: bronze
    description: "Raw, date-partitioned source pulls (read-only; never edited in place)."
    meta:
      attribution: "See public-data-sources.md; NOTICE.txt travels with each dataset."
    tables:
      - name: statcast
        description: "Pitch-level Statcast (© MLB Advanced Media / Baseball Savant) — derived analysis only."
      - name: lahman_teams
        description: "Lahman Teams table (CC BY-SA 3.0)."
      - name: retrosheet_events
        description: "Retrosheet play-by-play events (free w/ required notice)."
      - name: statsapi_schedule
        description: "MLB Stats API schedule (© MLBAM) — derived analysis only."
      - name: chadwick_register
        description: "Chadwick Bureau player ID crosswalk (open)."
